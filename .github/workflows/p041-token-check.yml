# P041 verification — THROWAWAY. Delete once the result is recorded in the change log.
#
# Answers two questions before any migration is built on top of them:
#   1. Does the sk-ant-oat01- subscription OAuth token authenticate from a GitHub-hosted runner?
#   2. Does `claude -p` run headless there at all?
#
# It does NOT touch index.html, does not commit, and does not push.
name: P041 token check   # retrigger 2

on:
  workflow_dispatch:          # manual button in the Actions tab
  push:
    paths:                    # runs only when this file itself changes
      - '.github/workflows/p041-token-check.yml'

permissions:
  contents: read              # no write access — this job must not be able to publish

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Show CLI version
        run: claude --version

      # Job logs need repo-admin auth to download, but the step summary is publicly
      # readable on the run page — so the verdict is written there instead.
      - name: Headless authenticated call
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          {
            echo "## P041 token check"
            echo ""
            echo "- CLI version: \`$(claude --version 2>&1 | head -1)\`"
            echo "- Secret length: **${#CLAUDE_CODE_OAUTH_TOKEN}** chars (expected 108)"
            echo "- Secret prefix: \`$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | cut -c1-12)\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "- **RESULT: FAIL — secret is empty or not visible to this workflow**" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          set +e
          OUT="$(claude -p "reply with exactly: OK" --output-format text 2>&1)"
          RC=$?
          set -e

          # ::error:: annotations are readable via the public check-runs API without auth,
          # unlike job logs (admin-only) and step summaries (sign-in). This is the only
          # channel that gets the verdict out of a repo I cannot authenticate against.
          FLAT="$(printf '%s' "$OUT" | tr '\n' ' ' | tr -s ' ' | cut -c1-400)"
          echo "::error::rc=$RC len=${#CLAUDE_CODE_OAUTH_TOKEN} out=$FLAT"

          {
            echo "- Exit code: **$RC**"
            echo ""
            echo "### CLI output"
            echo '```'
            printf '%s\n' "$OUT" | head -40
            echo '```'
            if [ "$RC" -eq 0 ]; then
              echo "**RESULT: PASS — the token authenticates from a GitHub-hosted runner.**"
            else
              echo "**RESULT: FAIL — see output above.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
